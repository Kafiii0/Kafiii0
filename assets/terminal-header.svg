<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Header Bar Gradient -->
    <linearGradient id="headerBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Glowing Text Filter -->
    <filter id="neonGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(250px); }
    }

    .cursor {
      animation: blinkCursor 1s infinite;
      fill: #38bdf8;
    }

    .prompt-user {
      fill: #38bdf8;
      font-weight: 700;
    }
    .prompt-at {
      fill: #8b949e;
      font-weight: 600;
    }
    .prompt-host {
      fill: #a855f7;
      font-weight: 700;
    }
    .prompt-path {
      fill: #eab308;
      font-weight: 700;
    }
    .prompt-char {
      fill: #22c55e;
      font-weight: 800;
    }
    .cmd {
      fill: #ffffff;
      font-weight: 600;
    }
    .output-key {
      fill: #f472b6;
      font-weight: 600;
    }
    .output-val {
      fill: #60a5fa;
    }
    .output-str {
      fill: #4ade80;
    }
    .comment {
      fill: #6e7681;
      font-style: italic;
    }

    .term-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13.5px;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Terminal Window Body -->
  <rect x="2" y="2" width="876" height="246" rx="12" ry="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.6"/>

  <!-- Terminal Title Bar -->
  <path d="M2 14 Q2 2 14 2 L866 2 Q878 2 878 14 L878 38 L2 38 Z" fill="url(#headerBar)" stroke="#30363d" stroke-width="1.6"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#30363d" stroke-width="1.2"/>

  <!-- macOS Window Controls (Red, Yellow, Green) -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>

  <!-- Terminal Title -->
  <text x="440" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600" fill="#8b949e" text-anchor="middle">
    kv@bandung:~ (zsh)
  </text>

  <!-- ================= TERMINAL CONTENT ================= -->
  <g class="term-text">
    <!-- Line 1: whoami -->
    <text x="25" y="66">
      <tspan class="prompt-user">kv</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> <tspan class="cmd">whoami</tspan>
    </text>
    <text x="25" y="88" fill="#e6edf3">
      ➜  <tspan font-weight="700" fill="#ffffff">KV</tspan> <tspan fill="#8b949e">(Al Kahfi)</tspan> &bull; <tspan fill="#38bdf8">Web Architecture &amp; Software Developer</tspan>
    </text>

    <!-- Line 2: fetch details -->
    <text x="25" y="118">
      <tspan class="prompt-user">kv</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> <tspan class="cmd">cat profile.json</tspan>
    </text>
    <text x="25" y="140">
      <tspan fill="#e6edf3">{ </tspan><tspan class="output-key">"location"</tspan><tspan fill="#8b949e">: </tspan><tspan class="output-str">"Bandung, Indonesia 🇮🇩"</tspan><tspan fill="#8b949e">, </tspan><tspan class="output-key">"website"</tspan><tspan fill="#8b949e">: </tspan><tspan class="output-val">"alkahfi.my.id"</tspan><tspan fill="#8b949e">, </tspan><tspan class="output-key">"pronouns"</tspan><tspan fill="#8b949e">: </tspan><tspan class="output-str">"he/him"</tspan><tspan fill="#e6edf3"> }</tspan>
    </text>

    <!-- Line 3: current focus -->
    <text x="25" y="170">
      <tspan class="prompt-user">kv</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> <tspan class="cmd">kv --status</tspan>
    </text>
    <text x="25" y="192">
      <tspan fill="#4ade80">● Active</tspan> <tspan fill="#8b949e">&bull;</tspan> <tspan fill="#e6edf3">Building clean, responsive web architecture &amp; exploring Go / IoT systems</tspan>
    </text>

    <!-- Line 4: prompt with blinking cursor -->
    <text x="25" y="224">
      <tspan class="prompt-user">kv</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> <tspan class="cmd">git commit -m "build the future" </tspan><tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
