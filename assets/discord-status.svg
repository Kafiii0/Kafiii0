<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 54" width="350" height="54">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #23a55a); transform: scale(1); }
      50% { opacity: 0.2; filter: drop-shadow(0 0 1px #23a55a); transform: scale(0.85); }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.45)); }
      50% { filter: drop-shadow(0 0 14px rgba(88, 101, 242, 0.75)); }
    }
    .status-dot {
      animation: blink 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      transform-origin: 285px 27px;
    }
    .discord-badge {
      animation: badgeGlow 2.5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #ffffff;
      letter-spacing: 0.3px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .status-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #23a55a;
    }
  </style>
  <rect x="1" y="1" width="348" height="52" rx="12" ry="12" fill="url(#cardGrad)" stroke="#383e47" stroke-width="1.4"/>
  <!-- Discord Icon Background -->
  <rect x="10" y="9" width="36" height="36" rx="9" fill="#5865F2" class="discord-badge"/>
  <!-- Discord Official Glyphs -->
  <path fill="#ffffff" d="M33.8 20.3c-1.5-.7-3.1-1.2-4.8-1.5-.2.4-.4.8-.6 1.2-1.8-.3-3.6-.3-5.4 0-.2-.4-.4-.8-.6-1.2-1.7.3-3.3.8-4.8 1.5-3.1 4.6-3.9 9.1-3.5 13.5 2 1.5 4 2.5 6 3.1.5-.7 1-1.4 1.4-2.1-1.1-.4-2-.9-2.9-1.6.2-.2.5-.4.7-.5 4 1.9 8.2 1.9 12.2 0 .2.2.5.3.7.5-.9.6-1.9 1.1-2.9 1.6.4.7.9 1.4 1.4 2.1 2-.6 4-1.6 6-3.1.5-5.2-.8-9.6-3.6-13.5zm-11 11c-1.2 0-2.1-1.1-2.1-2.4 0-1.3.9-2.4 2.1-2.4 1.2 0 2.1 1.1 2.1 2.4 0 1.3-.9 2.4-2.1 2.4zm6.8 0c-1.2 0-2.1-1.1-2.1-2.4 0-1.3.9-2.4 2.1-2.4 1.2 0 2.1 1.1 2.1 2.4 0 1.3-.9 2.4-2.1 2.4z"/>
  <!-- Typography -->
  <text x="56" y="25" class="title-text">Discord</text>
  <text x="56" y="41" class="sub-text">Connect with me &amp; community</text>
  <!-- Pulsing / Blinking Green Dot -->
  <circle cx="285" cy="27" r="5" fill="#23a55a" class="status-dot"/>
  <text x="296" y="30.5" class="status-label">Online</text>
</svg>
