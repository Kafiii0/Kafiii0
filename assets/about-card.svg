<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="tabActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #38bdf8; }

    .code-font {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13.5px;
      letter-spacing: 0.2px;
    }

    .ln { fill: #475569; font-weight: 500; text-anchor: end; }
    .kw { fill: #f43f5e; font-weight: 700; }
    .fn { fill: #38bdf8; font-weight: 600; }
    .prop { fill: #facc15; font-weight: 600; }
    .str { fill: #4ade80; }
    .pun { fill: #94a3b8; }
    .com { fill: #64748b; font-style: italic; }
  </style>

  <!-- Outer Card Frame with subtle neon border -->
  <rect x="2" y="2" width="876" height="386" rx="14" fill="url(#cardBg)" stroke="url(#neonBorder)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <path d="M2 14 Q2 2 14 2 L866 2 Q878 2 878 14 L878 38 L2 38 Z" fill="#0f172a"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="58" cy="20" r="5.5" fill="#10b981"/>

  <!-- Active Editor Tab -->
  <path d="M90 38 L90 12 Q90 8 94 8 L270 8 Q274 8 274 12 L274 38 Z" fill="url(#tabActive)" stroke="#334155" stroke-width="1"/>
  <!-- TS Icon Blue -->
  <rect x="104" y="15" width="16" height="16" rx="3" fill="#3178c6"/>
  <text x="112" y="27" font-family="-apple-system, sans-serif" font-size="10px" font-weight="800" fill="#ffffff" text-anchor="middle">TS</text>
  <text x="130" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#e2e8f0">about_kv.ts</text>

  <!-- Inactive Tab -->
  <text x="310" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="500" fill="#64748b">pentester_notes.sh</text>

  <!-- ================= CODE CONTENT ================= -->
  <g class="code-font">
    <!-- Line numbers column -->
    <text x="36" y="66" class="ln">1</text>
    <text x="36" y="89" class="ln">2</text>
    <text x="36" y="112" class="ln">3</text>
    <text x="36" y="135" class="ln">4</text>
    <text x="36" y="158" class="ln">5</text>
    <text x="36" y="181" class="ln">6</text>
    <text x="36" y="204" class="ln">7</text>
    <text x="36" y="227" class="ln">8</text>
    <text x="36" y="250" class="ln">9</text>
    <text x="36" y="273" class="ln">10</text>
    <text x="36" y="296" class="ln">11</text>
    <text x="36" y="319" class="ln">12</text>
    <text x="36" y="342" class="ln">13</text>
    <text x="36" y="365" class="ln">14</text>

    <!-- Code Line 1 -->
    <text x="56" y="66">
      <tspan class="kw">const</tspan> <tspan class="fn">kv</tspan> <tspan class="pun">=</tspan> <tspan class="pun">{</tspan>
    </text>

    <!-- Code Line 2: Name -->
    <text x="76" y="89">
      <tspan class="prop">name</tspan><tspan class="pun">:</tspan> <tspan class="str">"Al Kahfi (KV)"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 3: Role (Pentester Pemula) -->
    <text x="76" y="112">
      <tspan class="prop">role</tspan><tspan class="pun">:</tspan> <tspan class="str">"Pentester Pemula &amp; Fullstack Begadang 🛡️💻"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 4: Hacker Rank Joke -->
    <text x="76" y="135">
      <tspan class="prop">hackerStatus</tspan><tspan class="pun">:</tspan> <tspan class="str">"Bisa Inspect Element langsung ngerasa Mr. Robot 🕵️‍♂️"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 5: Daily Struggles -->
    <text x="76" y="158">
      <tspan class="prop">specialties</tspan><tspan class="pun">:</tspan> <tspan class="pun">{</tspan>
    </text>

    <!-- Code Line 6: CSS centering joke -->
    <text x="96" y="181">
      <tspan class="prop">cssNinja</tspan><tspan class="pun">:</tspan> <tspan class="str">"3 jam habis cuma buat nengahin posisi &lt;div&gt; 🎨"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 7: Backend joke -->
    <text x="96" y="204">
      <tspan class="prop">backend</tspan><tspan class="pun">:</tspan> <tspan class="str">"Service Go jalan di localhost, pas deploy pusing sendiri ⚙️"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 8: Pentester / Networking joke -->
    <text x="96" y="227">
      <tspan class="prop">networking</tspan><tspan class="pun">:</tspan> <tspan class="str">"PcapAnalyzer &amp; Wireshark packet sniffer connoisseur 🔍"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 9: Debugging joke -->
    <text x="96" y="250">
      <tspan class="prop">debugging</tspan><tspan class="pun">:</tspan> <tspan class="str">"Nambah console.log('masuk sini ga') di 50 baris 🐛"</tspan>
    </text>

    <!-- Code Line 10: Close specialties -->
    <text x="76" y="273">
      <tspan class="pun">},</tspan>
    </text>

    <!-- Code Line 11: Git push joke -->
    <text x="76" y="296">
      <tspan class="prop">gitProtocol</tspan><tspan class="pun">:</tspan> <tspan class="str">"git commit -m 'bismillah lancar' &amp;&amp; git push --force 🚀"</tspan><tspan class="pun">,</tspan>
    </text>

    <!-- Code Line 12: Fuel -->
    <text x="76" y="319">
      <tspan class="prop">dailyFuel</tspan><tspan class="pun">:</tspan> <tspan class="pun">[</tspan><tspan class="str">"Kopi Kapal Api ☕"</tspan><tspan class="pun">, </tspan><tspan class="str">"Stack Overflow 📚"</tspan><tspan class="pun">, </tspan><tspan class="str">"Doa Ibu 🤲"</tspan><tspan class="pun">],</tspan>
    </text>

    <!-- Code Line 13: Location -->
    <text x="76" y="342">
      <tspan class="prop">base</tspan><tspan class="pun">:</tspan> <tspan class="str">"Bandung, Indonesia 🇮🇩"</tspan>
    </text>

    <!-- Code Line 14: End object with blinking cursor -->
    <text x="56" y="365">
      <tspan class="pun">};</tspan> <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>